aid: lingco-language-labs
name: Lingco Language Labs
description: 'Lingco Language Labs, Inc. is a Delaware-incorporated education technology
  company operating Lingco Classroom, a cloud language-learning platform used by schools
  and universities. Lingco pairs a library of pre-built, customizable world-language
  content with an instructor platform for building courses, assigning activities and
  tracking learner outcomes. Lingco publishes no general-purpose public developer API;
  its integration surface is standards-based education interoperability: an IMS/1EdTech
  LTI 1.3 tool (OIDC third-party-initiated login, JWKS, Assignment and Grade Services
  and Names and Role Provisioning Services) hosted at class.lingco.io, OneRoster v1.1
  rostering via REST or SFTP CSV, a Canvas API client integration, and SSO with Google
  Classroom, Schoology and Clever.'
