apis:
- aid: lingco-language-labs-lti-1-3-tool
  name: Lingco Classroom LTI 1.3 Tool
  description: 'Lingco Classroom is registered in an LMS as an IMS/1EdTech LTI 1.3
    tool. The platform performs an OIDC third-party-initiated login against Lingco''s
    initiation endpoint, launches into the target link URI, and Lingco consumes
    Assignment and Grade Services (AGS) and Names and Role Provisioning Services
    (NRPS) on every launch to synchronize rosters and grades. Lingco publishes an
    RS256 JWKS for platform-side token verification.'
