  note: rostering records are matched on sourcedId plus username and email; Lingco
    publishes no id-prefix scheme of its own
sync:
  modes:
  - id: lti-launch
    trigger: every LTI 1.3 launch
    direction: inbound
    note: rosters via NRPS, grades via AGS
  - id: oneroster-rest
    trigger: instant or scheduled
    direction: inbound
    note: Lingco polls the SIS OneRoster REST endpoint
  - id: oneroster-csv
    trigger: daily or weekly batch
    transport: sftp
    direction: inbound
    note: full CSV bundles only, deltas not supported
  - id: canvas-api
    trigger: instructor-initiated grade and roster sync
    direction: bidirectional
    note: Lingco calls the Canvas REST API with an institution-issued developer key
  entities_synced:
  - orgs
  - users
  - courses
  - classes
  - enrollments
  - academicSessions
